server:
  port: 9000

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: MiniChat
              uri: lb://MiniChat
              predicates:
                - Path=/MiniChat/**
            - id: github
              uri: https://github.com
              predicates:
                - Path=/github/**
  security:
    user:
      name: admin
      password: pass
      roles: ADMIN

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    registerWithEureka: true
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: "*"